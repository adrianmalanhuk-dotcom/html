<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Portfólio - GitHub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            background: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 90%;
        }

        h1 {
            color: #24292e; /* Cor padrão do GitHub */
            margin-bottom: 15px;
        }

        p {
            line-height: 1.6;
            margin-bottom: 20px;
            color: #555;
        }

        .btn-github {
            display: inline-block;
            text-decoration: none;
            background-color: #24292e;
            color: #fff;
            padding: 12px 25px;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .btn-github:hover {
            background-color: #0366d6;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Olá, mundo!</h1>
        <p>Bem-vindo(a) ao meu site hospedado com sucesso utilizando o <strong>GitHub Pages</strong>. Este é apenas um template inicial pronto para ser personalizado.</p>
        <a href="#" class="btn-github">Visite meu perfil</a>
    </div>

    <script>   console.log("Página carregada com sucesso! Você pode editar este arquivo index.html conforme necessário.");
    </script>
</body>
</html>
